<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treuhand">

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script>
<title>Treuhand Startklar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
</head>
<body>
<style>
/* Layout: sticky top bar with tabs; one centered column (max 860px); lessons as stacked sections A–E */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#16202a; --muted:#596673; --line:#d9dee4;
  --accent:#c8102e; --accent-ink:#ffffff; --soft:#fbe9ec; --ok:#1d7a52; --ok-soft:#e3f3ea;
  --bad:#b4281d; --bad-soft:#fbe7e4; --note:#8a5a00; --note-soft:#fff4dc; --chip:#eef1f4;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#192028; --ink:#e6eaee; --muted:#9aa6b2; --line:#2b343e;
  --accent:#ff5c6c; --accent-ink:#1a0a0d; --soft:#3a1d23; --ok:#53c48e; --ok-soft:#173327;
  --bad:#ff8577; --bad-soft:#3b1d1a; --note:#e8b25a; --note-soft:#33280f; --chip:#232b34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#192028; --ink:#e6eaee; --muted:#9aa6b2; --line:#2b343e;
  --accent:#ff5c6c; --accent-ink:#1a0a0d; --soft:#3a1d23; --ok:#53c48e; --ok-soft:#173327;
  --bad:#ff8577; --bad-soft:#3b1d1a; --note:#e8b25a; --note-soft:#33280f; --chip:#232b34; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.flag{width:26px;height:26px;background:var(--accent);border-radius:4px;position:relative;flex:none}
.flag::before,.flag::after{content:"";position:absolute;background:var(--accent-ink);left:50%;top:50%;transform:translate(-50%,-50%)}
.flag::before{width:16px;height:5px}.flag::after{width:5px;height:16px}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:.9rem}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.bar{width:120px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs button{font:600 .92rem var(--body);border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
h2{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.15;letter-spacing:-.015em;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:28px 0 8px;text-wrap:balance}
h4{font-size:1.02rem;margin:18px 0 6px}
p{margin:0 0 12px}
.lead{color:var(--muted);font-size:1.05rem;max-width:65ch}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.stack{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.prose{max-width:68ch}
.prose ul,.prose ol{padding-left:1.2em;margin:0 0 12px}
.prose li{margin-bottom:4px}
de,.de{font-style:italic;color:var(--accent);font-weight:600}
.callout{border-radius:8px;padding:12px 14px;font-size:.96rem}
.callout.note{background:var(--note-soft);color:var(--ink)}
.callout.note b:first-child{color:var(--note)}
.callout.level{background:var(--chip)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--chip);font-weight:700}
tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{font:600 .95rem var(--body);border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.secHead{display:flex;align-items:baseline;gap:10px;border-top:2px solid var(--ink);padding-top:10px;margin-top:36px;flex-wrap:wrap}
.secHead .k{font-family:var(--mono);font-weight:600;color:var(--accent)}
.secHead h3{margin:0}
.secHead .t{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
/* calendar */
.weeks{display:grid;gap:22px}
.week h3{margin:0 0 10px;font-size:1.1rem}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{all:unset;box-sizing:border-box;display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:92px;cursor:default}
.day .n{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between}
.day .tt{font-size:.88rem;line-height:1.3}
.day.open{cursor:pointer;border-color:var(--ink)}
.day.open:hover{background:var(--chip)}
.day.open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day.done{border-color:var(--ok);background:var(--ok-soft)}
.day.locked{opacity:.62}
.pill{font-family:var(--mono);font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted)}
.pill.ok{background:var(--ok);color:var(--surface)}
.pill.go{background:var(--accent);color:var(--accent-ink)}
/* quiz */
.q{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface)}
.q .qt{font-weight:600;margin-bottom:10px}
.q .meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.opts{display:grid;gap:6px}
.opt{all:unset;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.97rem}
.opt:hover{background:var(--chip)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt.sel{border-color:var(--ink);background:var(--chip)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ex{margin-top:10px;font-size:.94rem;padding:10px 12px;border-radius:8px;background:var(--chip)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.score div{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.score b{display:block;font-family:var(--display);font-size:1.8rem}
/* vocab */
.vocab{display:grid;gap:10px}
.term{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.term .w{font-weight:700;font-size:1.05rem}
.term .g{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.term .u{margin:2px 0}
.term .s{font-size:.93rem;color:var(--muted)}
.term .x{font-size:.93rem;margin-top:4px;font-style:italic}
textarea,input[type=search]{width:100%;font:inherit;font-size:.96rem;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
select{font:inherit;font-size:.95rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%}
.doclist{display:grid;gap:6px;padding:0;list-style:none;margin:0 0 12px}
.doclist li{padding:8px 12px;border-left:3px solid var(--accent);background:var(--chip);border-radius:0 6px 6px 0;font-size:.95rem}
.gap{line-height:2.3}
/* flashcards */
.card{min-height:220px;display:grid;place-items:center;text-align:center;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;user-select:none}
.card .front{font-family:var(--display);font-weight:800;font-size:1.7rem}
.card .back{display:grid;gap:6px}
.boxes{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
/* simple-mode lesson blocks */
.big{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.3;margin:4px 0 18px;text-wrap:balance}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.lv{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:12px 14px;background:var(--surface)}
.lv h5{font-family:var(--display);font-size:1.1rem;margin:0}
.lv .who{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.lv ul{margin:0;padding-left:1.1em;font-size:.95rem}
.lv .no{font-size:.88rem;color:var(--muted);margin-top:6px}
.story{display:grid;gap:8px;list-style:none;padding:0;margin:0 0 8px}
.story li{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.story .tm{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.story .tag{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:1px 7px;border-radius:99px;margin-left:4px}
.tag.dir{background:var(--soft);color:var(--accent)}.tag.ind{background:var(--note-soft);color:var(--note)}.tag.non{background:var(--chip);color:var(--muted)}
.steps{display:grid;gap:6px;margin-bottom:8px}
.steps div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--chip)}
.steps div.hl{background:var(--soft)}
.steps b.num{font-size:1.05rem}
.remember{counter-reset:r;list-style:none;padding:0;display:grid;gap:8px}
.remember li{counter-increment:r;display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start}
.remember li::before{content:counter(r);font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--accent);line-height:1.2}
details.more{margin-top:24px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}
details.more>summary{cursor:pointer;font-weight:700}
.fx{font-family:var(--mono);font-size:.88rem;background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.prose code{font-family:var(--mono);font-size:.85em;background:var(--chip);padding:1px 5px;border-radius:4px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.muted{color:var(--muted)}
.small{font-size:.88rem}
a{color:var(--accent)}
@media (max-width:520px){h2{font-size:1.55rem}.prog .bar{width:70px}body{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="flag" aria-hidden="true"></div>
      <div><h1>Treuhand Startklar</h1><div class="sub">30 днів до Praktikum · Kanton Zürich</div></div>
      <div class="prog" title="Завершені уроки"><span id="progTxt">0/30</span><div class="bar"><i id="progBar"></i></div></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Розділи">
      <button data-v="plan">План</button>
      <button data-v="diagnose">Діагностика</button>
      <button data-v="lesson">Урок</button>
      <button data-v="cards">Karteikarten</button>
      <button data-v="glossar">Glossar</button>
      <button data-v="fehler">Fehler</button>
      <button data-v="extra">Додатково</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- storage (per-browser convenience) ---------- */
const KEY='treuhand30_v1';
let S={done:{},diag:null,mistakes:[],cards:{},drafts:{},answered:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800)}
function copy(text,msg){
  const done=()=>toast(msg||'Скопійовано — вставте в чат');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallback())}else fallback();
  function fallback(){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){toast('Виділіть текст вручну')}t.remove()}
}

/* ---------- curriculum ---------- */
const WEEKS=[
 {t:'Тиждень 1 · Основи швейцарської податкової системи',d:[
  'Bund, Kanton, Gemeinde. Direkte und indirekte Steuern',
  'Steuerpflicht, Steuerdomizil, Quellensteuer, ordentliche Veranlagung',
  'Einkommen, Vermögen, Schulden, Abzüge',
  'Lohn, Nebeneinkommen, selbständige Erwerbstätigkeit, Kapitalerträge, Renten',
  'Berufsauslagen, Versicherungsprämien, Säule 3a, Schuldzinsen, Weiterbildung',
  'Steuererklärung im Kanton Zürich: Unterlagen, ZHprivateTax, Einreichung',
  'Repetition + Simulation: einfache Steuererklärung']},
 {t:'Тиждень 2 · Складніші податки та розрахунки',d:[
  'Steuerbares Einkommen vs. steuerbares Vermögen',
  'Steuerprogression, Steuertarif, Steuerfuss',
  'Quellensteuer und nachträgliche ordentliche Veranlagung (NOV)',
  'Ehepaare, Familien, Kinder, Haushaltstypen',
  'Liegenschaften: Eigenmietwert, Hypotheken, Unterhalt, Grundstückgewinnsteuer',
  'Kapitalerträge, Dividenden, Wertschriften, Verrechnungssteuer, Krypto',
  'Fallstudie: komplexere Steuererklärung prüfen']},
 {t:'Тиждень 3 · Buchhaltung, Treuhand та зарплати',d:[
  'Bilanz, Erfolgsrechnung, Aktiven, Passiven, Eigenkapital',
  'Doppelte Buchhaltung: Soll, Haben, Buchungssätze, Kontenplan',
  'Debitoren, Kreditoren, Rechnungen, Mahnungen',
  'Mehrwertsteuer: Steuerpflicht, Vorsteuer, Abrechnungsmethoden',
  'Lohnbuchhaltung: AHV, IV, EO, ALV, BVG, UVG, Quellensteuer',
  'Jahresabschluss: Abschreibungen, Rückstellungen, Abgrenzungen',
  'Fallstudie: Buchungen, Lohnabrechnung, Belegprüfung']},
 {t:'Тиждень 4 · Просунуті теми та реальна робота',d:[
  'Unternehmen: Einzelunternehmen, GmbH, AG. Gewinn- und Kapitalsteuer',
  'Selbständig vs. unselbständig erwerbend',
  'Steueroptimierung vs. Steuerhinterziehung vs. Steuerbetrug',
  'Internationales: DBA, Ansässigkeit, ausländische Einkünfte',
  'Veranlagung, Einsprache, Fristen, Nachsteuern, Strafverfahren',
  'Mandantenbetreuung, Datenschutz, Vollmachten, Dokumentenprüfung',
  'Simulation: Mandant bringt Unterlagen',
  'Simulation: ein Arbeitstag im Treuhandbüro',
  'Schlussprüfung: Theorie, Fachwortschatz, Fälle']}
];
const DAYS=[];WEEKS.forEach((w,wi)=>w.d.forEach(t=>DAYS.push({t,w:wi})));

/* ---------- diagnostic ---------- */
const DIAG=[
 {area:'Steuern',q:'Який рівень держави в Швейцарії НЕ стягує податок на майно (Vermögenssteuer) з фізичних осіб?',o:['Bund','Kanton','Gemeinde'],a:0,ex:'Bund стягує direkte Bundessteuer лише на Einkommen (і Gewinn юросіб). Vermögenssteuer — це кантональний і муніципальний податок.'},
 {area:'Steuern',q:'Що таке Steuerfuss у кантоні Zürich?',o:['Максимальна ставка податку у відсотках від доходу','Множник (у %), на який множиться «einfache Staatssteuer»','Неоподатковуваний мінімум доходу','Строк сплати податку'],a:1,ex:'Тариф дає «простий податок» (einfache Steuer). Кантон, громада і церква множать його на свій Steuerfuss, напр. 95 % або 119 %.'},
 {area:'Steuern',q:'Яка ставка Verrechnungssteuer на дивіденди швейцарських компаній?',o:['8,1 %','15 %','35 %','Залежить від кантону'],a:2,ex:'35 % — федеральна ставка (VStG). Для резидентів Швейцарії вона повертається, якщо дохід і майно задекларовано.'},
 {area:'Steuern',q:'Іноземка з дозволом B заробляє 130 000 CHF брутто на рік і сплачує Quellensteuer. Що відбувається?',o:['Нічого, Quellensteuer завжди остаточний','Обов’язкова nachträgliche ordentliche Veranlagung (NOV)','Вона може обрати лише кантональне оподаткування','Вона автоматично отримує C-дозвіл'],a:1,ex:'З реформи 2021 року: при доході від 120 000 CHF на рік NOV обов’язкова, і особа подає звичайну декларацію.'},
 {area:'Steuern',q:'Як внесок у Säule 3a впливає на податок?',o:['Зменшує податок на ту саму суму (Steuergutschrift)','Зменшує оподатковуваний дохід (Abzug vom Einkommen)','Не впливає, лише на пенсію','Зменшує тільки Vermögenssteuer'],a:1,ex:'Це Abzug — він зменшує базу. Реальна економія = внесок × граничну ставку, а не вся сума внеску.'},
 {area:'Buchhaltung',q:'Компанія оплачує з банку рахунок постачальника, раніше вже проведений. Який Buchungssatz?',o:['Bank / Kreditoren','Kreditoren / Bank','Aufwand / Bank','Debitoren / Bank'],a:1,ex:'Зобов’язання (Kreditoren, пасив) зменшується в Soll, банк (актив) зменшується в Haben: Kreditoren an Bank.'},
 {area:'Buchhaltung',q:'Де в балансі знаходиться Eigenkapital?',o:['Aktiven','Passiven','Erfolgsrechnung','Ніде, лише в примітках'],a:1,ex:'Пасиви показують, звідки фінансування: Fremdkapital і Eigenkapital.'},
 {area:'Buchhaltung',q:'Що таке Vorsteuer?',o:['MWST, яку підприємство нараховує клієнтам','MWST, сплачена постачальникам, яку можна відрахувати','Авансовий платіж прямого податку','Податок, утриманий із зарплати'],a:1,ex:'Vorsteuer — вхідний ПДВ. Підприємство платить ESTV різницю: Umsatzsteuer мінус Vorsteuer.'},

<p class="big">Головна ідея: податки у Швейцарії збирають <b>три рівні</b>, і кожен збирає свої.</p>

<div class="levels">
 <div class="lv"><h5>Bund</h5><div class="who">уся Швейцарія</div>

 <div class="lv"><h5>Kanton</h5><div class="who">напр. Zürich</div>
  <ul><li><de>Einkommenssteuer</de>: податок із доходу</li><li><de>Vermögenssteuer</de>: податок на майно</li></ul></div>
 <div class="lv"><h5>Gemeinde</h5><div class="who">напр. Stadt Zürich, Winterthur</div>
  <ul><li><de>Gemeindesteuer</de>: теж із доходу й майна</li><li><de>Kirchensteuer</de>: лише якщо людина в церкві</li></ul></div>
</div>

<h4>Приклад: один день Олени</h4>
<ul class="story">

 <li><span class="tm">25-го</span><span>Отримує зарплату. З неї знімають AHV і пенсійний внесок. Це <b>внески</b>, а не податки. <span class="tag non">не податок</span></span></li>

 <li><span class="tm">березень</span><span>Подає <de>Steuererklärung</de>. Потім отримує рахунки на податок із доходу. Платить сама й бачить суму. <span class="tag dir">прямий податок</span></span></li>
</ul>
<p class="small muted">Просте правило: якщо податок «захований» у ціні, він <b>непрямий</b>. Якщо рахунок приходить особисто тобі, він <b>прямий</b>.</p>

<h4>Як рахують податок у Zürich: 3 кроки</h4>

</div>
<p class="small">Олена переїжджає в громаду зі Steuerfuss 80 %. Тоді крок 3 = 5’000 × 80 % = <b>4’000</b>. Кроки 1 і 2 не змінюються. <b>Steuerfuss — це множник, а не ставка.</b></p>

<p class="lead">Мета дня: зрозуміти, <b>хто</b> в Швейцарії має право стягувати податки, <b>чому</b> це влаштовано саме так і як це видно в документах клієнта.</p>

<h4>1. Що це таке</h4>
<p>Швейцарія — федерація з трьох рівнів: <de>Bund</de> (конфедерація), 26 <de>Kantone</de> і понад 2000 <de>Gemeinden</de>. Кожен рівень має власні податки, власні бюджети й частково власне законодавство.</p>

<h4>2. Навіщо так влаштовано</h4>
<p>Логіка «знизу вгору». Кантони історично старші за федеральну державу (1848). Тому за Конституцією (<de>BV Art. 3</de>) кантони суверенні у всьому, що не передано Bund. Для податків це означає:</p>
<ul>
 <li><b>Kantone</b> мають первинну <de>Steuerhoheit</de>: можуть стягувати будь-який податок, якщо Конституція не заборонила.</li>
 <li><b>Bund</b> може стягувати <b>лише</b> податки, прямо названі в Конституції: <de>direkte Bundessteuer</de> (BV Art. 128), <de>MWST</de> (Art. 130), <de>Stempelabgaben</de> і <de>Verrechnungssteuer</de> (Art. 132) тощо. Право на DBSt і MWST навіть обмежене в часі (зараз до кінця 2035 року) і продовжується народним голосуванням.</li>
 <li><b>Gemeinden</b> мають лише похідну (<de>abgeleitete</de>) Steuerhoheit: стільки, скільки дозволить кантон.</li>
</ul>
<p>Наслідок: <b>податкова конкуренція</b> (<de>Steuerwettbewerb</de>) між кантонами і громадами. Однаковий дохід у Zug, Zürich і Genf оподатковується дуже по-різному. Це не «лазівка», а задум системи.</p>

<h4>3. Як це працює (Kanton Zürich)</h4>
<div class="tbl"><table>
<tr><th>Рівень</th><th>Основні податки</th><th>Правова основа</th></tr>

<tr><td><b>Kanton ZH</b></td><td>Einkommens- und Vermögenssteuer · Gewinn- und Kapitalsteuer · Personalsteuer · Erbschafts- und Schenkungssteuer · Verkehrsabgaben (Motorfahrzeuge)</td><td>Steuergesetz ZH (StG ZH, LS 631.1); рамка — StHG</td></tr>
<tr><td><b>Gemeinde ZH</b></td><td>Gemeindesteuer (множник на einfache Staatssteuer) · <b>Grundstückgewinnsteuer</b> (у ZH її стягують громади!) · Kirchensteuer (через Kirchgemeinden) · Hundeabgabe</td><td>StG ZH + рішення громади про Steuerfuss</td></tr>
</table></div>

<p style="margin-top:14px"><b>Гармонізація.</b> Щоб 26 систем не розійшлися зовсім, є <de>Steuerharmonisierungsgesetz (StHG)</de>. Він гармонізує <i>що</i> оподатковується, строки й процедури (<de>formelle Harmonisierung</de>). А от <i>скільки</i> — тарифи, Steuerfüsse, розмір багатьох Abzüge — кожен кантон вирішує сам.</p>

<p><b>Одна декларація — кілька податків.</b> У ZH клієнт подає <b>одну</b> <de>Steuererklärung</de>. На її основі визначаються і <de>Staats- und Gemeindesteuern</de>, і direkte Bundessteuer. Кантон виконує DBG від імені Bund і залишає собі 21,2 % надходжень DBSt.</p>

<h4>4. Прямі vs. непрямі податки</h4>
<div class="tbl"><table>

<tr><td>Приклади</td><td>Einkommenssteuer, Vermögenssteuer, DBSt, Gewinnsteuer</td><td>MWST, Zölle, Tabaksteuer, Mineralölsteuer</td></tr>
<tr><td>Хто головний «власник»</td><td>Кантони й громади</td><td>Bund</td></tr>
</table></div>
<p style="margin-top:12px"><b>Причинний зв’язок:</b> Bund отримує найбільше від MWST (непрямий), а кантони й громади живуть переважно з прямих податків. Тому для кантонів так важливі Einkommens- і Vermögenssteuer. Звідси й податкова конкуренція саме у прямих податках.</p>
<p><b>Особливий випадок — Verrechnungssteuer.</b> Формально це федеральний податок, який утримується біля джерела (35 % з дивідендів і відсотків). Але для резидента CH це <de>Sicherungssteuer</de>: якщо дохід задекларовано, 35 % повертаються або зараховуються. Це «заставний» механізм проти недекларування, а не остаточний податок.</p>

<h4>5. Чим відрізняється від схожих понять</h4>
<ul>
 <li><de>Steuer</de> vs. <de>Gebühr</de>: податок без прямої зустрічної послуги; Gebühr — плата за конкретну послугу (вивіз сміття, паспорт).</li>
 <li><de>Steuer</de> vs. <de>Sozialversicherungsbeitrag</de>: AHV/IV/EO, ALV, BVG — це <b>внески</b>, не податки. Вони йдуть у страхові фонди й створюють права (пенсія тощо).</li>
 <li><de>Steuersatz</de> vs. <de>Steuerfuss</de>: ставка — відсоток від бази; Steuerfuss — множник на вже розрахований простий податок.</li>
 <li><de>Steuerdomizil</de> (де живеш станом на 31.12) визначає, яка громада й кантон оподатковують цілий рік. Детально — день 2.</li>
</ul>

<h4>6. Приклад із життя</h4>
<p>Марко живе в Stadt Zürich і працює в Zug. Він отримує <b>два різні рахунки</b>: від Steueramt der Stadt Zürich — Staats-, Gemeinde- і Kirchensteuer; від Kantonales Steueramt Zürich — direkte Bundessteuer. Податки в Zug він не платить: оподатковує кантон проживання, а не роботи (для найманої праці). Якщо Марко переїде в Küsnacht (нижчий Steuerfuss), то при тому ж доході його Gemeindesteuer зменшиться, а Staatssteuer і DBSt залишаться тими самими.</p>

<h4>7. Як із цим працює Treuhand Sachbearbeiterin</h4>
<ul>
 <li>Розпізнає, від кого документ: <de>provisorische Rechnung</de>, <de>Schlussrechnung</de>, <de>Veranlagungsverfügung</de> — для Staats-/Gemeindesteuern чи для DBSt.</li>
 <li>Перевіряє, що в програмі правильно вказані громада й конфесія (вони впливають на Steuerfuss і Kirchensteuer).</li>
 <li>Пояснює клієнту, чому рахунків два і чому вони приходять у різний час.</li>
 <li>Не плутає податки з внесками AHV чи Gebühren, коли сортує документи клієнта.</li>
</ul>

<h4>8. Типові помилки</h4>
<ul>
 <li>Вважати, що Bund стягує Vermögenssteuer.</li>
 <li>Порівнювати громади за Steuerfuss, забуваючи, що він множиться на однаковий кантональний простий податок, а DBSt від нього не залежить.</li>
 <li>Забути про Kirchensteuer, коли клієнт вийшов із церкви (або навпаки — не перевірити дату виходу).</li>
 <li>Вважати 35 % Verrechnungssteuer «втраченими грошима» — і не декларувати рахунок.</li>
 <li>Оплатити одним платежем обидва рахунки: це різні кредитори й різні банківські реквізити.</li>
</ul>

<h4>Два питання, які Treuhand ставить кожному новому клієнту</h4>
<div class="levels">

<ul class="story">

<h4>Що таке Quellensteuer простими словами</h4>
<p>Це як «податок наперед». Роботодавець щомісяця знімає відсоток із зарплати й відправляє в Steueramt. В одній цифрі вже є все: Bund + Kanton + Gemeinde (+ Kirche). Відсоток залежить від доходу, сімейного стану, кількості дітей і конфесії (<de>Tarifcode</de>, напр. A0N або B1Y).</p>
<p class="small">Порівняйте: Anna спершу заробляє, а наступного року подає декларацію й отримує рахунок. Olena платить одразу, щомісяця.</p>

<h4>Коли Quellensteuer «не вистачає»: NOV</h4>
<div class="steps">

 <div><span>Є інші доходи або майно, з яких податок не знято</span><b>NOV обов’язкова</b></div>

</div>
<p class="small">Подати прохання про NOV можна <b>до 31 березня</b> наступного року. Якщо NOV уже була, наступні роки теж будуть з NOV. Правила NOV діють з реформи 2021 року (DBG Art. 89, 89a). У ZH (Wegleitung 2025) NOV також обов’язкова, якщо інші доходи без Quellensteuer становлять від 3’000 CHF або майно — від 80’000 CHF (одна особа) / 160’000 CHF (подружжя).</p>

<h4>Як іде звичайна декларація (рік 2025)</h4>
<ul class="story">

 <li><span class="tm">пізніше</span><span>Steueramt перевіряє й надсилає <de>Veranlagungsverfügung</de> (рішення) і <de>Schlussrechnung</de>.</span></li>

<h4>Persönliche vs. wirtschaftliche Zugehörigkeit</h4>
<ul>
 <li><b>Persönliche Zugehörigkeit</b> → unbeschränkte Steuerpflicht (DBG Art. 3, StHG Art. 3). Виникає через <de>steuerrechtlichen Wohnsitz</de> (проживання з наміром залишитися, центр життєвих інтересів) або <de>Aufenthalt</de>: щонайменше 30 днів із роботою або 90 днів без роботи.</li>
 <li><b>Wirtschaftliche Zugehörigkeit</b> → beschränkte Steuerpflicht (DBG Art. 4–5): нерухомість, Betriebsstätte, підприємство в CH при проживанні за кордоном.</li>
 <li>Unbeschränkt не означає «все оподатковується в CH». Іноземна нерухомість і Betriebsstätten звільняються (<de>Freistellung</de>), але враховуються для визначення ставки (<de>Progressionsvorbehalt</de>). Детально — день 25.</li>
</ul>
<h4>Початок і кінець Steuerpflicht</h4>
<ul>
 <li>Переїзд з-за кордону або за кордон протягом року → <de>unterjährige Steuerpflicht</de>: оподатковується лише період проживання в CH, але ставка визначається за річним доходом (<de>Satzbestimmung</de>).</li>
 <li>Переїзд між кантонами → <de>Stichtagsprinzip</de> (StHG Art. 68): весь рік — кантон проживання на кінець податкового періоду. Виняток: нерухомість (кантон розташування) і Quellensteuer (за місяцями).</li>
</ul>
<h4>Quellensteuer: деталі для Treuhänderin</h4>
<ul>
 <li>Підлягають: іноземці без C з Wohnsitz у CH (B, L, F, N тощо). Не підлягають: особи, що перебувають у шлюбі зі швейцарцем/швейцаркою або власником C. Вони йдуть у ordentliche Veranlagung.</li>
 <li>Quellensteuer для нерезидентів: Grenzgänger, артисти, члени ради директорів, пенсіонери з CH-пенсіями. Для них є <de>Quasi-Ansässigkeit</de>: якщо щонайменше 90 % світового доходу оподатковується в CH, NOV можна подати на прохання.</li>
 <li>Роботодавець — <de>Schuldner der steuerbaren Leistung (SSL)</de>. Він відповідає за правильне утримання й отримує <de>Bezugsprovision</de>.</li>
 <li>Тарифи (A — неодружені, B — одружені з одним доходом, C — подвійний дохід, H — самотні з дітьми тощо) встановлюються кантоном. Код у Lohnausweis/Lohnabrechnung варто перевіряти: помилки трапляються часто.</li>
</ul>
<p class="small muted">Джерела: DBG (SR 642.11) Art. 3–5, 83–89a; Quellensteuerverordnung QStV (SR 642.118.2); StHG Art. 68; Kantonales Steueramt Zürich, Merkblätter Quellensteuer.</p>`,

<h4>Логіка: чому саме так</h4>
<ul>
 <li>Податок на дохід оподатковує <b>приріст</b> економічної спроможності за період (<de>Reinvermögenszugangstheorie</de>). Тому все, що надійшло за рік, — це Einkommen, якщо закон не робить винятку.</li>
 <li>Податок на майно оподатковує <b>запас</b> (<de>Bestand</de>) на певну дату. Тому важливий Saldo на 31.12, а не середнє значення.</li>
 <li>Винятки з Einkommen (<de>steuerfreie Einkünfte</de>, DBG Art. 24): напр. спадщина й дарування (за них кантон стягує окремий податок), приватний <de>Kapitalgewinn</de> на рухомому майні (прибуток від продажу акцій приватною особою).</li>
</ul>
<h4>Два типи Abzüge</h4>
<ul>
 <li><b>Gewinnungskosten / organische Abzüge</b>: витрати, без яких дохід не отримати. Напр. Berufsauslagen, Liegenschaftsunterhalt, Vermögensverwaltungskosten.</li>
 <li><b>Allgemeine Abzüge</b>: дозволені законом із соціальних міркувань. Напр. 3a, Versicherungsprämien, Schuldzinsen, Kinderbetreuungskosten.</li>
 <li><b>Sozialabzüge</b>: фіксовані суми за особисту ситуацію (діти, підтримувані особи). Для податку на майно — <de>steuerfreie Beträge</de>.</li>
</ul>
<h4>Оцінка майна</h4>
<ul>
 <li>Цінні папери — за курсом на 31.12 (<de>Kursliste ESTV</de>).</li>
 <li>Нерухомість — за кантональною оцінкою (<de>Vermögenssteuerwert</de>), зазвичай нижчою за ринкову.</li>

<p class="small muted">Джерела: DBG Art. 16–33; StHG Art. 7–9, 13–14; StG ZH; ESTV Kursliste (ictax.admin.ch).</p>`,

<p class="big">Головна ідея: майже <b>всі гроші, що надійшли</b>, — це дохід. Питання лише в тому, <b>який це вид доходу</b> і куди його вписати в декларації.</p>

<div class="levels">
 <div class="lv"><h5>Lohn</h5><div class="who">наймана робота</div>
  <ul><li>Основна робота, документ — <de>Lohnausweis</de></li></ul></div>

  <ul><li>Друга робота: офіціантка, прибирання, бебісітинг. <b>Теж</b> дохід, навіть маленький</li></ul></div>

  <ul><li>Власні клієнти й рахунки. Дохід = <b>прибуток</b> (надходження − витрати)</li></ul></div>

<h4>Приклад: рік Тараса</h4>

 <li><span class="tm">вихідні</span><span>Підробляє офіціантом у ресторані, має другий Lohnausweis. <span class="tag dir">Nebenerwerb</span></span></li>

</ul>

<h4>Найдивніше правило: дивіденд vs. продаж акції</h4>
<div class="steps">
 <div><span>Акція принесла <b>дивіденд</b> 100 CHF</span><b>оподатковується</b></div>
 <div class="hl"><span>Акцію <b>продали дорожче</b> на 100 CHF</span><b>не оподатковується</b></div>
</div>
<p class="small">Чому так? Дивіденд — це «врожай», регулярний дохід від майна. Прибуток від продажу — це зміна вартості самого майна (<de>privater Kapitalgewinn</de>), і для приватних осіб Швейцарія його свідомо не оподатковує (DBG Art. 16 Abs. 3). Виняток — люди, які торгують професійно (<de>gewerbsmässiger Wertschriftenhandel</de>).</p>

<h4>Найманий чи самозайнятий?</h4>

</div>
<p class="small">Детально про різницю — день 23.</p>

<h4>Що <b>не</b> є доходом (steuerfrei)</h4>
<ul class="story">

<h4>Запам’ятайте 3 речі</h4>

<div class="callout level" style="margin-top:14px"><b>Що від вас чекатимуть як від Praktikantin:</b> знайти в документах клієнта <b>всі</b> джерела доходу й помітити ті, про які клієнт «забув сказати»: підробіток, ALV, іноземну пенсію.</div>`,
 full:`
<h4>Загальне правило (Generalklausel)</h4>
<p>DBG Art. 16 Abs. 1: оподатковуються <b>всі</b> періодичні й одноразові доходи. Закон перелічує приклади (Art. 17–23), але перелік відкритий. Неоподатковувані доходи — лише ті, які закон прямо називає в Art. 24 (<de>abschliessende Aufzählung</de>). Тому логіка перевірки така: «чи є виняток у законі?», а не «чи згадано це як дохід?».</p>
<h4>Renten і Kapitalleistungen</h4>
<ul>
 <li>Пенсії AHV/IV і пенсії Pensionskasse оподатковуються повністю (100 %). Для деяких старих пенсій PK діють перехідні правила (80 %).</li>
 <li>Одноразові виплати з пенсійних накопичень (<de>Kapitalleistungen aus Vorsorge</de>: виплата 3a, капітал PK) оподатковуються <b>окремо</b> від решти доходу і за зниженою ставкою (DBSt: 1/5 від тарифу). Детально — у темі Säule 3a.</li>
 <li>Leibrenten (Säule 3b): оподатковується лише частина (<de>Ertragsanteil</de>). Правило змінилося з 2025 року (Leibrentenreform): частка тепер залежить від рівня відсотків. Конкретний відсоток перевіряйте за актуальним Merkblatt ESTV.</li>
</ul>
<h4>Selbständige Erwerbstätigkeit</h4>
<ul>
 <li>Оподатковується прибуток за обліком (<de>Buchhaltung</de> або для малих — <de>Aufzeichnungen</de> про надходження, витрати й майно, DBG Art. 125 Abs. 2).</li>
 <li>Оцінка статусу самозайнятості для AHV робиться окремо Ausgleichskasse і може відрізнятися від податкової оцінки. Для дуже малого Nebenerwerb можливе звільнення від AHV-внесків за заявою (поріг встановлено в AHVV; актуальну суму перевіряйте на ahv-iv.ch).</li>
</ul>
<h4>Особливості для Quellensteuer</h4>
<p>Якщо особа з дозволом B або статусом S має другу роботу, другий роботодавець теж утримує Quellensteuer, як правило, за спеціальним тарифом. Самостійна діяльність і доходи від майна Quellensteuer не охоплюються, тому можуть вимагати NOV.</p>
<p class="small muted">Джерела: DBG Art. 16–24, 37b, 38; StHG Art. 7; ESTV Kreisschreiben zu Leibrenten; AHVG / AHVV.</p>`,

<p><b>Тема дня: читання короткого професійного тексту.</b> Прочитайте уривок (стиль Merkblatt Steueramt). Потім дайте відповіді на питання.</p>
<div class="panel" style="font-size:.97rem">
<p><i>Steuerbar sind sämtliche Einkünfte aus unselbständiger und selbständiger Erwerbstätigkeit. Dazu gehören auch Einkünfte aus einem <b>Nebenerwerb</b>, unabhängig von deren Höhe. Ebenfalls steuerbar sind Leistungen, die an die Stelle des Erwerbseinkommens treten, wie Taggelder der Arbeitslosen-, Kranken- oder Unfallversicherung. Nicht steuerbar sind hingegen Kapitalgewinne aus der Veräusserung von beweglichem Privatvermögen sowie Unterstützungen aus öffentlichen Mitteln.</i></p>
</div>

 theory:`
<p class="big">Головна ідея: <b>Abzug</b> зменшує не податок, а <b>суму, з якої рахують податок</b>. І майже кожен Abzug має <b>межу</b>, причому <b>дві</b>: для кантону й для Bund.</p>

<h4>Як працює Abzug</h4>
<div class="steps">
 <div><span>Дохід Олени</span><b class="num">80’000</b></div>
 <div><span>− внесок у Säule 3a</span><b class="num">−7’258</b></div>
 <div class="hl"><span>Податок рахують уже з</span><b class="num">72’742</b></div>
</div>
<p class="small">Олена економить <b>не</b> 7’258 CHF, а лише податок, який припадав би на ці 7’258. Якщо умовна гранична ставка — 25 %, економія ≈ 7’258 × 25 % ≈ <b>1’800 CHF</b>. Тому Abzug — це «знижка на базу», а не «знижка на податок».</p>

<h4>П’ять головних Abzüge найманого працівника</h4>
<div class="levels">
 <div class="lv"><h5>Berufsauslagen</h5><div class="who">витрати на роботу</div><ul><li>Дорога, обід поза домом, інші професійні витрати</li></ul></div>
 <div class="lv"><h5>Säule 3a</h5><div class="who">приватна пенсія</div><ul><li>Внесок за рік, до межі</li></ul></div>
 <div class="lv"><h5>Versicherungs&shy;prämien</h5><div class="who">страховки</div><ul><li>Krankenkasse тощо, але лише до невеликої межі</li></ul></div>
 <div class="lv"><h5>Schuldzinsen</h5><div class="who">відсотки за боргами</div><ul><li>Кредит, Hypothek (день 3)</li></ul></div>
 <div class="lv"><h5>Weiterbildung</h5><div class="who">навчання для роботи</div><ul><li>Курси, які ви оплатили самі</li></ul></div>
</div>

<h4>Цифри на 2025 рік (Kanton Zürich)</h4>
<div class="tbl"><table>
<tr><th>Abzug</th><th>Staatssteuer ZH</th><th>Bundessteuer</th></tr>
<tr><td>Дорога громадським транспортом</td><td>вартість абонемента, макс. <b>5’200</b></td><td>макс. <b>3’300</b></td></tr>
<tr><td>Дорога велосипедом</td><td colspan="2">Pauschale 700</td></tr>
<tr><td>Обід поза домом</td><td colspan="2">15/день, макс. 3’200 · з Kantine: 7.50/день, макс. 1’600</td></tr>
<tr><td>Інші витрати на роботу (Pauschale)</td><td colspan="2">3 % Nettolohn, мін. 2’000, макс. 4’000</td></tr>
<tr><td>Säule 3a (є Pensionskasse)</td><td colspan="2">макс. <b>7’258</b></td></tr>
<tr><td>Страховки (одна особа, є PK/3a)</td><td>макс. <b>2’900</b></td><td>макс. <b>1’800</b></td></tr>
<tr><td>Weiterbildung</td><td>макс. 12’400</td><td>макс. 13’000</td></tr>
</table></div>
<p class="small muted">Джерело: Kantonales Steueramt Zürich, Wegleitung zur Steuererklärung 2025; ESTV Rundschreiben 2-210-D-2024 (Tarif 2025). Для 2026 року суми можуть змінитися.</p>

<h4>Одна декларація — дві колонки</h4>
<p>У формулярі Zürich кожен Abzug має <b>дві колонки</b>: <de>Staatssteuer</de> і <de>Bundessteuer</de>. Межі різні, тому й <de>steuerbares Einkommen</de> виходить два різні. Це нормально, і ви це бачитимете в кожній декларації.</p>

<h4>Типові помилки (дуже часті!)</h4>
<ul class="story">
 <li><span class="tm">авто</span><span>Клієнт їздить машиною, хоча є автобус. Тоді можна відрахувати лише вартість <b>абонемента</b>. Кілометри (0.70/км) — тільки у винятках: немає транспорту, економія понад 1 годину, хвороба.</span></li>
 <li><span class="tm">каса</span><span>Krankenkasse 5’000 → в декларацію пишуть усі 5’000. Але межа — 2’900 (ZH). І спершу треба відняти <de>Prämienverbilligung</de> (державну знижку на премію).</span></li>
 <li><span class="tm">3a</span><span>Внесли 8’000 → відраховують лише 7’258. Решту банк має повернути.</span></li>
 <li><span class="tm">курс</span><span>Курс оплатив роботодавець → клієнт <b>не</b> може його відрахувати.</span></li>
 <li><span class="tm">спорт</span><span>Фітнес, окуляри «для комп’ютера», одяг для офісу → <b>не</b> відраховуються (вже входять у Pauschale 3 %).</span></li>
</ul>

<h4>Запам’ятайте 3 речі</h4>
<ol class="remember">
 <li><span>Abzug зменшує <b>базу</b>, а не податок. Економія = Abzug × гранична ставка.</span></li>
 <li><span>Майже кожен Abzug має <b>межу</b>, і в ZH їх <b>дві</b>: Staatssteuer і Bundessteuer.</span></li>
 <li><span>Дорога — за ціною <b>абонемента</b>. Страховки — <b>до межі</b>, після Prämienverbilligung.</span></li>
</ol>

<div class="callout level" style="margin-top:14px"><b>Що від вас чекатимуть як від Praktikantin:</b> заповнити формуляри «Berufsauslagen» і «Versicherungsprämien», не перевищити межі й помітити, що клієнт забув (3a, курс, Prämienverbilligung).</div>
<div class="callout note" style="margin-top:10px"><b>Для вас особисто (статус S).</b> Паушальні (фіксовані) витрати на роботу й страховки вже враховані в тарифі Quellensteuer. А от 3a і Weiterbildung — ні. Саме тому NOV буває вигідною (день 2).</div>`,
 full:`
<h4>Логіка: навіщо держава дозволяє Abzüge</h4>
<ul>

 <li><b>Sozial- und wirtschaftspolitische Abzüge</b> (3a, страховки, Weiterbildung): держава стимулює поведінку — заощаджувати на пенсію, навчатися.</li>
 <li><b>Sozialabzüge</b> (діти): враховують здатність платити (<de>wirtschaftliche Leistungsfähigkeit</de>). ZH 2025: 9’300 на дитину, DBSt: 6’800.</li>
</ul>
<h4>Pauschale чи ефективні витрати</h4>
<p>Для «інших витрат на роботу» і для Nebenerwerb (20 %, мін. 800, макс. 2’400) можна обрати Pauschale (фіксовану суму без чеків) або реальні витрати. Реальні витрати треба довести повністю (Aufstellung + Belege). Обирають те, що вигідніше, і лише одне з двох.</p>
<h4>Інші Abzüge (детальніше в день 14)</h4>
<ul>

 <li>Einkauf in die Pensionskasse (добровільна доплата в пенсійну касу): відраховується повністю. Але якщо протягом 3 років забрати гроші з PK капіталом, Abzug скасовують.</li>
 <li>Weiterbildung: умова — є перший диплом Sek II або вік від 20 років; вирішальна дата <b>оплати</b>, а не курсу.</li>
</ul>
<p class="small muted">Джерела: StG ZH § 26–34; DBG Art. 26–33a; Wegleitung ZH 2025, с. 13–21.</p>`,

<h4>Фрази для пояснень</h4>
<div class="tbl"><table>
<tr><th>Фраза</th><th>Коли</th></tr>

<h4>Граматика: умови — sofern, falls, soweit</h4>
<p class="small"><b>sofern</b> = за умови, що (офіційно) · <b>falls</b> = якщо, у випадку (нейтрально) · <b>soweit</b> = наскільки, у межах того, що<br>

<p class="big">Головна ідея: декларація — це <b>процес у 7 кроків</b> із чіткими строками. Робота Treuhand — провести клієнта через усі кроки й нічого не пропустити.</p>

<h4>Шлях однієї декларації (податковий рік 2025)</h4>
<ul class="story">
 <li><span class="tm">січ–лют</span><span><b>1. Лист від Steueramt.</b> Клієнт отримує бланк <de>Steuererklärung 2025</de> і код доступу для онлайн-подання.</span></li>

 <li><span class="tm">бер</span><span><b>4. Перевірка.</b> У Treuhand декларацію завжди перевіряє друга людина (принцип «чотирьох очей»).</span></li>

<h4>Список документів (Checkliste)</h4>
<div class="levels">
 <div class="lv"><h5>Einkommen</h5><div class="who">що отримав</div><ul><li>Lohnausweis (усі роботодавці)</li><li>Довідка ALV / KTG</li><li>Довідки про пенсії</li></ul></div>

 <div class="lv"><h5>Abzüge</h5><div class="who">що витратив</div><ul><li>Довідка 3a</li><li>Абонемент, курси + оплата</li><li>Krankenkasse + Prämienverbilligung</li></ul></div>

</div>
<p class="small">Те саме правило 4 кошиків із Дня 3, тільки тепер як список документів. Плюс завжди: <b>торішня декларація й рішення</b> — для порівняння.</p>

<h4>Корисний трюк: eSteuerauszug</h4>
<p class="small">Багато швейцарських банків видають <de>eSteuerauszug</de> зі штрихкодом. Його можна <b>імпортувати</b> в онлайн-декларацію, і всі рахунки й доходи заповнюються автоматично. Менше ручної роботи, менше помилок.</p>

<h4>Що буде, якщо не подати</h4>
<div class="steps">

</div>
<p class="small">Оцінка Steueramt зазвичай <b>вища</b> за реальність. Оскаржити її потім дуже складно. Тому строки — найважливіше в роботі Treuhand.</p>

<p class="small">Протягом року клієнт отримує <b>провізорні рахунки</b>. Платежі до 1 жовтня отримують відсотки на користь клієнта (2025: 1 %, 2026: 0,75 %). Після <de>Schlussrechnung</de> є 30 днів на оплату, далі — <de>Verzugszins</de> 4,5 %.</p>

<h4>Запам’ятайте 3 речі</h4>

<div class="callout level" style="margin-top:14px"><b>Що від вас чекатимуть як від Praktikantin:</b> зібрати документи за чеклистом, написати клієнту, чого бракує, внести дані в програму й стежити за строками. Підписує й відповідає за зміст — клієнт, перевіряє — Teamleiterin.</div>
<p class="small muted">Джерело: Kantonales Steueramt Zürich, Wegleitung zur Steuererklärung 2025, с. 4–9 і 31–32. Умови Fristerstreckung (онлайн, можливі збори, колективні продовження для Treuhand) уточнюйте на zh.ch і у вашій компанії.</p>`,
 full:`
<h4>Einschätzung vs. Veranlagung: два слова для одного</h4>
<p>У Zürich для <b>Staats- und Gemeindesteuern</b> кажуть <de>Einschätzung</de> / <de>Einschätzungsentscheid</de>, а для <b>direkte Bundessteuer</b> — <de>Veranlagung</de> / <de>Veranlagungsverfügung</de>. За змістом це те саме: офіційне рішення про оподатковуваний дохід і майно.</p>
<h4>Vertretung (представництво)</h4>
<p>На першій сторінці декларації є поле «Vertreter/in bevollmächtigt zur Entgegennahme von Auflagen und Entscheiden» з Treuhänder-ID. Якщо Treuhand вказаний тут, Steueramt надсилає питання й рішення <b>до Treuhand</b>. Для цього потрібна письмова <de>Vollmacht</de> від клієнта (день 27).</p>
<h4>Ermessenseinschätzung: чому її треба оскаржувати навіть якщо вона низька</h4>
<p>Wegleitung ZH прямо радить: якщо оцінка Steueramt занизька, подати Einsprache з правильною декларацією. Інакше пізніше, коли з’ясується правда, буде <de>Nachsteuer- und Bussenverfahren</de> (ухилення від податків).</p>
<h4>Steuerhinterziehung і Selbstanzeige</h4>
<ul>
 <li>Неповна декларація → Nachsteuer + штраф від 1/3 до 3-кратної Nachsteuer.</li>
 <li>Спроба → 2/3 від штрафу за завершене ухилення.</li>
 <li>Перша <de>Selbstanzeige</de> (добровільне визнання з чітким поясненням) — за певних умов без штрафу. Тема дня 24.</li>
</ul>
<p class="small muted">Джерела: Wegleitung ZH 2025 с. 7–8; DBG Art. 174, 175, 181a; StG ZH § 234 ff.</p>`,

<p class="big">Головна ідея: уся декларація — це <b>одна формула</b>. Сьогодні складаємо все з тижня 1 докупи й заповнюємо першу декларацію від початку до кінця.</p>

 full:`
<h4>Порядок у справжньому бланку ZH</h4>
<p>У бланку ZH розрахунок іде кількома проміжними сумами: спершу <i>Total der Einkünfte</i>, потім віднімаються Berufsauslagen, 3a, страховки тощо, далі окремо — Spenden і Krankheitskosten (їхні ліміти рахуються від проміжної суми), і лише наприкінці виходить <i>Steuerbares Einkommen</i>. У прикладах курсу ми рахуємо спрощено, одним рядком.</p>
<h4>Майно: декларувати треба все</h4>
<p>Навіть невелике майно вносимо в декларацію. Податок на майно в ZH починається лише понад першу сходинку тарифу: 0 ‰ на перші 80’000 для ledig у 2025 році (день 8). Відсотки з цього майна однаково є доходом.</p>

</table></div>
<p class="small"><b>Навіщо гранична ставка?</b> Щоб відповісти клієнту: додатковий Abzug 1’000 CHF заощадить Lena приблизно <b>200 CHF</b> (1’000 × 20 %).</p>

<p class="small muted">Джерела: Regierungsratsbeschluss ZH 833/2025 (тариф із вирівнюванням 3,3 % від 2024 року); ESTV, Rundschreiben 2-210-D-2024, Tarif 2025 Art. 36 DBG; zh.ch «Aktuelle Gemeindesteuerfüsse». Приклад спрощено: одна база для ZH і Bund, без Kirchensteuer.</p>`,

 caseHtml:`

      el.dataset.done=1;const j=+b.dataset.j;res[i]=j===q.a;
      el.querySelectorAll('.opt').forEach((x,k)=>{if(k===q.a)x.classList.add('right');else if(k===j)x.classList.add('wrong')});
      const ex=document.createElement('div');ex.className='ex';ex.innerHTML=(j===q.a?'<b>Правильно.</b> ':'<b>Не зовсім.</b> ')+esc(q.ex);el.appendChild(ex);
      if(j!==q.a){S.mistakes=S.mistakes.filter(m=>m.q!==q.q);S.mistakes.push({src:tag,q:q.q,your:q.o[j],right:q.o[q.a],ex:q.ex,o:q.o,a:q.a,area:q.area});save()}
      if(Object.keys(res).length===qs.length&&onDone)onDone(res)});
    container.appendChild(el)});
}

function renderDiag(){
  app.innerHTML=`<div class="eyebrow">Einstufung</div><h2>Діагностичний тест</h2>
  <p class="lead">15 питань: податки, бухгалтерія, професійна німецька. Відповідайте чесно, без пошуку: результат визначить темп і глибину уроків. Пояснення з’являється одразу після відповіді.</p>

    const by={Steuern:0,Buchhaltung:0,Deutsch:0};DIAG.forEach((q,i)=>{if(res[i])by[q.area]++});
    const total=by.Steuern+by.Buchhaltung+by.Deutsch;S.diag={by,total,date:new Date().toISOString().slice(0,10)};save();showDiagResult()});

let deck=[],ci=0,flipped=false;
function renderCards(){
  const box=w=>S.cards[w]||1;
  deck=GLOSS.slice().sort((a,b)=>box(a.w)-box(b.w)||Math.random()-.5);ci=0;flipped=false;
  const counts=[1,2,3,4,5].map(b=>GLOSS.filter(g=>box(g.w)===b).length);
  app.innerHTML=`<div class="eyebrow">Karteikarten · Leitner</div><h2>Повторення термінів</h2>
  <p class="lead">Натисніть картку, щоб перевернути. «Знаю» переносить її в наступну коробку, «Ще ні» повертає в коробку 1. Слабкі картки йдуть першими.</p>
  <div class="boxes" style="margin:10px 0 14px">${counts.map((c,i)=>`<span class="pill">Box ${i+1}: ${c}</span>`).join('')}</div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="Перевернути картку"></div>
  <div class="row" style="margin-top:12px;justify-content:center"><button class="btn ghost" id="no">Ще ні</button><button class="btn accent" id="yes">Знаю</button></div>
  <p class="small muted" style="text-align:center;margin-top:8px" id="cpos"></p>`;
  const draw=()=>{const t=deck[ci];document.getElementById('card').innerHTML=flipped?`<div class="back"><b style="font-size:1.2rem">${esc(t.u)}</b><span class="muted">${esc(t.s)}</span><i>${esc(t.x)}</i></div>`:`<div class="front">${esc(t.w)}</div>`;document.getElementById('cpos').textContent=`${ci+1}/${deck.length} · Box ${box(t.w)}`};
  const flip=()=>{flipped=!flipped;draw()};
  const card=document.getElementById('card');card.onclick=flip;card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  const next=k=>{const w=deck[ci].w;S.cards[w]=k?Math.min(5,box(w)+1):1;save();ci=(ci+1)%deck.length;flipped=false;draw()};
  document.getElementById('yes').onclick=()=>next(true);document.getElementById('no').onclick=()=>next(false);draw()}

 check:[{area:'bexio',q:'Яка кнопка робить рахунок проведеним?',o:['Speichern als Entwurf','Als offen markieren','Zahlung erfassen','Jetzt abgleichen'],a:1,ex:'Entwurf ще не проведено. Als offen markieren проводить рахунок.'},{area:'bexio',q:'Рахунок без MWST. Що обрати?',o:['Опцію steuerbefreit','Ставку 0 %','Ставку 8.1 %','Залишити поле порожнім'],a:1,ex:'Опції steuerbefreit тут немає, використовують ставку 0 %.'}]},
{t:'Zahlung і Abgleich: найважливіший урок',min:8,html:`
<p class="big">Два способи оплати. Їх <b>не можна змішувати</b>, бо вийде подвійна проводка.</p>
<div class="tbl"><table>
<tr><th></th><th>A. Через bexio</th><th>B. Вручну</th></tr>
<tr><td><b>Кнопка</b></td><td>Zahlung erfassen</td><td>Manuelle Zahlung</td></tr>
<tr><td><b>Що робить</b></td><td>Створює платіж: його передають у банк</td><td>Лише записує, що вже оплачено</td></tr>
<tr><td><b>Коли Bezahlt</b></td><td>після Abgleich</td><td>одразу</td></tr>
<tr><td><b>Abgleich потім?</b></td><td>✅ так</td><td>❌ ні, буде подвійна проводка</td></tr>
</table></div>
<h4>Abgleich за 4 кроки</h4>
<div class="steps">
 <div><span>1. <de>Banking</de>: виберіть рахунок</span></div>
 <div><span>2. <de>Transaktionen abholen</de> або <de>Banktransaktionen importieren</de> (файл camt)</span></div>
 <div><span>3. <de>Transaktionen abgleichen</de>: ліворуч банк, праворуч bexio</span></div>
 <div class="hl"><span>4. Перевірте пропозицію → <b>Jetzt abgleichen</b></span></div>
</div>
<h4>Яка транзакція — що робити</h4>
<div class="tbl"><table>
<tr><th>Ситуація</th><th>Дія</th></tr>
<tr><td>Клієнт оплатив рахунок</td><td>Вибрати рахунок → Jetzt abgleichen</td></tr>
<tr><td>Один платіж за кілька рахунків</td><td><de>Betrag aufteilen</de>: суми мають збігатися</td></tr>
<tr><td>Документа немає (комісія банку)</td><td>Вкладка <de>manuelle Buchung</de></td></tr>
<tr><td>Витрата</td><td>Вкладка <de>Aufwendungen</de></td></tr>
<tr><td>Помилилися</td><td><de>Banktransaktionen anzeigen → Aktionen → Abgleich rückgängig</de></td></tr>
</table></div>
<p class="small">Статуси: <de>Nicht abgeglichen</de> (ще ні), <de>Automatisch abgeglichen</de>, <de>Abgeglichen</de>, <de>Ignoriert</de> (не потрапляє в бухгалтерію).</p>
<h4>Запам’ятайте</h4>
<ol class="remember">
 <li><span><b>Manuelle Zahlung + Abgleich = подвійна проводка.</b></span></li>
 <li><span>Abgleich показує лише рахунки зі статусом <de>Offen</de> або <de>Teilweise</de>.</span></li>
 <li><span>Скасування розділеного Abgleich видаляє <b>всі</b> його проводки.</span></li>
</ol>`,
 task:'На виписці −15.00 CHF «Kontoführungsgebühr». Рахунка в bexio немає. Що робите?',answer:'Вкладка <b>manuelle Buchung</b>: номер документа, рахунок витрат (банківські комісії, номер за Kontenplan клієнта), опис, сума, MWST, потім <b>abgleichen</b>.',
 check:[{area:'bexio',q:'Рахунок позначили через Manuelle Zahlung, а потім прийшла транзакція з банку. Зводити?',o:['Так, завжди','Ні, буде подвійна проводка','Так, але двічі','Видалити рахунок'],a:1,ex:'Manuelle Zahlung уже зробила проводку. Новий Abgleich цього рахунка продублював би її.'},{area:'bexio',q:'Рахунка немає в списку Abgleich. Яка найімовірніша причина?',o:['Він не Offen / Teilweise','Банк закритий','Неправильний логін','MWST 0 %'],a:0,ex:'У списку лише рахунки зі статусом Offen або Teilweise. Перевірте статус, контакт і номер.'},{area:'bexio',q:'Платіж клієнта 1’000 покриває два рахунки: 600 і 400. Що робите?',o:['Зводите лише один','Betrag aufteilen','Ignoriert','Manuelle Zahlung двічі'],a:1,ex:'Betrag aufteilen: 600 + 400. Суми з обох боків мають збігатися.'}]},
{t:'Рахунки клієнтам, QR і Mahnung',min:6,html:`
<p class="big">Шлях рахунка: <b>Angebot → Rechnung → оплата → за потреби Mahnung</b>.</p>
<div class="tbl"><table>
<tr><th>Завдання</th><th>Як</th></tr>
<tr><td>Рахунок з Angebot</td><td>Angebot має статус <de>Bestätigt</de>, потім вибираємо позиції</td></tr>
<tr><td>QR-рахунок</td><td>Один раз: у Banking додати рахунок і ввімкнути <de>Rechnung mit QR-Code</de></td></tr>
<tr><td>Оплата QR</td><td>Може звестися автоматично, якщо є відповідний рахунок</td></tr>
</table></div>
<h4>Mahnung</h4>
<div class="steps">
 <div><span>1. Рахунок має статус <de>überfällig</de></span></div>
 <div><span>2. Вкладка <de>Mahnungen</de> → <de>Rechnung auf nächste Mahnstufe setzen</de></span></div>
 <div class="hl"><span>3. <de>Mahnung per E-Mail senden</de> або PDF для пошти</span></div>
</div>
<div class="callout note"><b>Перед Mahnung:</b> перевірте Abgleich. Можливо, клієнт уже заплатив, а транзакцію ще не зведено. Mahnung оплаченого рахунка псує довіру.</div>
<p class="small">Mahnung надсилають лише з дозволу Teamleiterin або клієнта.</p>`,
 task:'Рахунок прострочено. Клієнт каже: «Я заплатив минулого тижня». Що перевіряєте?',answer:'1) Чи завантажено транзакції в Banking. 2) Чи є цей платіж у списку Nicht abgeglichen. 3) Якщо є, зводимо, і статус оновиться. Mahnung не надсилаємо.',
 check:[{area:'bexio',q:'Який статус потрібен Angebot, щоб зробити рахунок?',o:['Entwurf','Bestätigt','Überfällig','Bezahlt'],a:1,ex:'Angebot має бути Bestätigt.'},{area:'bexio',q:'Який статус рахунка потрібен для Mahnung?',o:['Entwurf','Offen','Überfällig','Bezahlt'],a:2,ex:'Mahnung створюють із рахунка зі статусом überfällig.'}]},
{t:'Journal, manuelle Buchung і Kontenblatt',min:8,html:`
<p class="big">Journal показує <b>усі проводки</b>. Спосіб виправлення залежить від типу проводки.</p>
<p class="small"><de>Buchhaltung → Berichte → Journal</de></p>
<div class="tbl"><table>
<tr><th>Тип</th><th>Звідки</th><th>Як виправити</th></tr>
<tr><td><b>Automatische</b></td><td>рахунки, витрати</td><td>Відкрити документ через «Referenz»</td></tr>
<tr><td><b>Manuelle</b></td><td>внесено вручну</td><td>Відкрити проводку → олівець</td></tr>
<tr><td><b>Bank</b></td><td>Abgleich або оплата</td><td><de>Abgleich rückgängig machen</de> і звести знову</td></tr>
<tr><td><b>Kundenkonto</b></td><td>рахунок клієнта</td><td>Не редагується: зустрічна проводка</td></tr>
<tr><td><b>Eröffnung</b></td><td>початок року</td><td>Не редагується: зустрічна проводка</td></tr>
</table></div>
<h4>Manuelle Buchung</h4>
<p class="small"><de>Buchhaltung → Manuelle Buchung</de>: дата, Soll, Haben, опис, MWST, сума, потім <b>Buchen</b> (або Shift + Enter).</p>
<div class="tbl"><table>
<tr><th>Приклад</th><th>Soll</th><th>Haben</th><th class="num">CHF</th></tr>
<tr><td>Комісія банку</td><td>Bankspesen</td><td>1020 Bank</td><td class="num">15.00</td></tr>
</table></div>
<ul>
 <li>Суми вносять <b>брутто</b>, з MWST.</li>
 <li>Видалення кошиком прибирає проводку <b>без сліду</b> в журналі: зустрічної проводки немає. Спершу спитайте.</li>
</ul>
<h4>Kontenblatt: ваша головна перевірка</h4>
<p class="small">Показує всі рухи одного рахунку. Фільтри: Konto, Datum, Betrag, MWST-Satz, Beschreibung. Можна експортувати в <b>Excel</b> або PDF.</p>
<p class="small"><b>Звичка:</b> порівнюйте кінцевий баланс 1020 Bank із випискою банку на ту саму дату.</p>`,
 task:'Банк на 31.03 показує 12’480.20, а Kontenblatt 1020 — 12’495.20. Різниця? Яка перша гіпотеза?',answer:'Різниця <b>15.00</b>. Гіпотеза: не проведено комісію банку 15.00. Перевіряємо список Nicht abgeglichen у Banking.',
 check:[{area:'bexio',q:'Як виправити автоматичну проводку з рахунка?',o:['Видалити в Journal','Відкрити документ через Referenz','Олівець у проводці','Неможливо'],a:1,ex:'Automatische проводки контролює документ, тож міняємо документ.'},{area:'bexio',q:'Як вносити суму в manuelle Buchung?',o:['Нетто','Брутто, з MWST','Лише MWST','Без копійок'],a:1,ex:'Help Center: суми завжди вносять брутто.'}]},
{t:'MWST і Jahresabschluss: огляд',min:7,html:`
<p class="big">Це робить досвідчений колега. Ваше завдання: <b>знати, де це, і допомагати перевіряти</b>.</p>
<h4>MWST</h4>
<div class="steps">
 <div><span>1. <de>Buchhaltung → Mehrwertsteuer</de>: форма за цифрами, як у ESTV</span></div>
 <div><span>2. Період: <de>Quartal/Geschäftsjahr ändern</de></span></div>
 <div><span>3. Деталі: Kontenblatt, фільтр <de>MWST-Ziffer</de></span></div>
 <div class="hl"><span>4. Після подання: <de>Quartal als abgerechnet markieren</de></span></div>
</div>
<p class="small muted">Цю статтю Help Center давно не оновлювали. Звірте шлях у своїй версії.</p>
<h4>Чеклист перед MWST</h4>
<ul>
 <li>Усі транзакції зведено?</li>
 <li>Усі рахунки внесено з правильною ставкою?</li>
 <li>Немає чернеток (Entwurf) за цей квартал?</li>
</ul>
<h4>Jahresabschluss</h4>
<div class="tbl"><table>
<tr><th>Що</th><th>Правило</th></tr>
<tr><td>Порядок</td><td>Спершу <b>найстаріший</b> відкритий рік</td></tr>
<tr><td>Erfolg</td><td>Manuelle Buchung на 31.12 через рахунок <b>9200</b></td></tr>
<tr><td>Bilanz і Erfolgsrechnung</td><td>мають бути збалансовані</td></tr>
<tr><td>Saldovortrag</td><td>Лише в основній валюті. Для іноземної — ручні проводки</td></tr>
<tr><td>Новий рік</td><td>Перевірити <de>Nummernkreise</de></td></tr>
</table></div>
<p class="small">Безкоштовні курси й чеклист є на bexio.com → Treuhand. Запитайте в компанії, що вони використовують.</p>`,
 task:'Teamleiterin просить перевірити MWST за Q1. Що робите першим?',answer:'Перевіряємо, чи все внесено й зведено за Q1 (Banking, чернетки). Потім <b>Buchhaltung → Mehrwertsteuer</b>, вибираємо період і звіряємо цифри з Kontenblatt. Позначати квартал має відповідальна особа.',
 check:[{area:'bexio',q:'Який рік закривають першим?',o:['Найновіший','Найстаріший відкритий','Будь-який','Поточний'],a:1,ex:'Завжди спершу найстаріший відкритий рік.'},{area:'bexio',q:'Що робить Quartal als abgerechnet markieren?',o:['Надсилає форму в ESTV','Закриває квартал: його цифри більше не змінюються','Видаляє проводки','Створює рахунок'],a:1,ex:'Квартал позначено, і форма за нього більше не змінюється. Подання в ESTV — окремий крок.'}]}
]},
excel:{t:'Excel',sub:'Формули й прийоми для роботи в Treuhand. 6 уроків.',note:'Формули написано для німецького Excel: назви німецькою, між аргументами «;». В англійському Excel назви інші: SUMIFS, XLOOKUP, IF. Дані вигадані.',
sources:[['SUMMEWENNS','https://support.microsoft.com/de-de/excel/functions/sumifs-function'],['SVERWEIS','https://support.microsoft.com/de-de/excel/functions/vlookup-function'],['WENN','https://support.microsoft.com/de-de/excel/if-function-nested-formulas-and-avoiding-pitfalls'],['Excel-Funktionen nach Kategorie','https://support.microsoft.com/de-de/excel/excel-functions-by-category']],
lessons:[
{t:'Ваші дані й три швидкі прийоми',min:5,html:`
<p class="big">В усіх уроках — та сама таблиця. Вставте її один раз у клітинку <b>A1</b>.</p>
${dataBtn('belege','рахунки (A1)')}
<div class="tbl"><table>
<tr><th>Datum</th><th>Lieferant</th><th>Konto</th><th class="num">Brutto</th><th>Bezahlt</th></tr>
<tr><td>02.03.2026</td><td>Immo AG</td><td>6000</td><td class="num">1800.00</td><td>Ja</td></tr>
<tr><td>05.03.2026</td><td>Garage Frei</td><td>6200</td><td class="num">430.50</td><td>Ja</td></tr>
<tr><td colspan="5" class="muted">… усього 8 рядків (рядки 2–9)</td></tr>
</table></div>
<h4>Три прийоми</h4>
<div class="tbl"><table>
<tr><th>Завдання</th><th>Як</th></tr>
<tr><td>Зафіксувати діапазон у формулі</td><td><code>$G$2:$H$5</code> (клавіша F4; на Mac Cmd + T)</td></tr>
<tr><td>Завжди бачити заголовки</td><td><de>Ansicht → Fenster fixieren</de></td></tr>
<tr><td>Швидкий фільтр</td><td><de>Daten → Filtern</de></td></tr>
</table></div>
<h4>Навіщо $</h4>
<p class="small">Копіюємо формулу вниз. Без <code>$</code> діапазон теж зсувається вниз, і результат стає неправильним. З <code>$</code> він залишається на місці.</p>
<div class="callout note"><b>Перевірка:</b> числа стоять праворуч у клітинці. Якщо ліворуч, Excel, ймовірно, вважає їх текстом (урок 5).</div>`,
 task:'Яка формула порахує всю колонку Brutto і скільки вийде?',answer:'<code>=SUMME(D2:D9)</code> → <b>5’100.70</b>',
 check:[{area:'Excel',q:'Що робить $ у $G$2?',o:['Показує франки','Не дає адресі зсуватися під час копіювання','Округлює','Робить жирним'],a:1,ex:'$ фіксує колонку й рядок.'}]},
{t:'SUMMEWENN і SUMMEWENNS: суми за умовою',min:7,html:`
<p class="big">Головна формула бухгалтера: <b>«скільки всього на рахунку 6000?»</b></p>
<div class="fx">=SUMMEWENN(C2:C9;6000;D2:D9)</div>
<p class="small">Читаємо: у колонці C шукаємо 6000, додаємо значення з D. Результат: <b>3’600.00</b></p>
<div class="fx">=SUMMEWENN(E2:E9;"Nein";D2:D9)</div>
<p class="small">Неоплачені рахунки: <b>2’468.30</b>. Текст завжди в лапках.</p>
<h4>Кілька умов: SUMMEWENNS</h4>
<div class="fx">=SUMMEWENNS(D2:D9;C2:C9;6000;E2:E9;"Nein")</div>
<p class="small">Рахунок 6000 <b>і</b> не оплачено: <b>1’800.00</b></p>
<div class="callout note"><b>Пастка:</b> у SUMMEWENN діапазон суми стоїть <b>в кінці</b>, а в SUMMEWENNS — <b>на початку</b>.</div>
<p class="small">Результат 0? Перевірте лапки й чи число не збережено як текст.</p>`,
 task:'Порахуйте суми для кожного з рахунків 6200, 6500, 6570 і неоплачене для 6570.',answer:'6200: <b>558.80</b> · 6500: <b>312.00</b> · 6570: <b>629.90</b><br>Неоплачене 6570: <code>=SUMMEWENNS(D2:D9;C2:C9;6570;E2:E9;"Nein")</code> → <b>540.00</b>',
 check:[{area:'Excel',q:'Де діапазон суми в SUMMEWENNS?',o:['Першим','Другим','Останнім','Його немає'],a:0,ex:'SUMMEWENNS(Summe_Bereich; Kriterien_Bereich1; Kriterien1; …).'},{area:'Excel',q:'Яка помилка в =SUMMEWENN(E2:E9;Nein;D2:D9)?',o:['Немає','Nein без лапок','Забагато аргументів','Потрібен $'],a:1,ex:'Текстова умова має бути в лапках: "Nein".'}]},
{t:'XVERWEIS: знайти значення в іншій таблиці',min:7,html:`
<p class="big">Є номер рахунку, треба його назва. Шукаємо в іншій таблиці замість ручного вводу.</p>
<p class="small">Вставте довідник у клітинку <b>G1</b>:</p>
${dataBtn('konten','Kontenplan (G1)')}
<p class="small">У F2:</p>
<div class="fx">=XVERWEIS(C2;$G$2:$G$5;$H$2:$H$5;"fehlt")</div>
<div class="tbl"><table>
<tr><th>Частина</th><th>Значення</th></tr>
<tr><td><code>C2</code></td><td>що шукаємо</td></tr>
<tr><td><code>$G$2:$G$5</code></td><td>де шукаємо</td></tr>
<tr><td><code>$H$2:$H$5</code></td><td>що повертаємо</td></tr>
<tr><td><code>"fehlt"</code></td><td>що показати, якщо не знайдено</td></tr>
</table></div>
<p class="small">Копіюємо вниз. Для 6000 буде <b>Raumaufwand</b>.</p>
<h4>Старий Excel: SVERWEIS</h4>
<div class="fx">=SVERWEIS(C2;$G$2:$H$5;2;FALSCH)</div>
<ul>
 <li><code>2</code>: друга колонка діапазону.</li>
 <li><code>FALSCH</code>: точний збіг. Без нього можна отримати неправильний результат.</li>
 <li>Шукана колонка має бути <b>першою</b> в діапазоні.</li>
</ul>
<p class="small muted">XVERWEIS є в нових версіях Excel. Якщо Excel його не знає, використовуйте SVERWEIS.</p>`,
 task:'Що показує #NV або «fehlt» і де шукати причину?',answer:'Значення не знайдено. Перевірте: чи є номер у довіднику, чи обидва є числами (а не одне з них текстом), чи немає зайвих пробілів.',
 check:[{area:'Excel',q:'Що означає FALSCH у SVERWEIS?',o:['Точний збіг','Формула хибна','Шукати знизу','Округлити'],a:0,ex:'FALSCH вимагає точного збігу. Для рахунків і номерів це потрібно майже завжди.'},{area:'Excel',q:'Для чого $ в XVERWEIS?',o:['Щоб довідник не зсувався під час копіювання','Для валюти','Для округлення','Для кольору'],a:0,ex:'Без $ довідник зсувався б на кожному рядку.'}]},
{t:'WENN, RUNDEN і MWST',min:6,html:`
<p class="big">Excel вирішує за вас: <b>якщо так, то це, інакше те</b>.</p>
<div class="fx">=WENN(E2="Nein";"offen";"bezahlt")</div>
<div class="fx">=WENN(D2&gt;500;"prüfen";"")</div>
<p class="small">Друга формула позначає суми понад 500 для перевірки.</p>
<h4>Порахувати MWST з брутто (8.1 %)</h4>
<div class="tbl"><table>
<tr><th>Що</th><th>Формула</th><th class="num">Для 216.20</th></tr>
<tr><td>Нетто</td><td><code>=RUNDEN(D2/1.081;2)</code></td><td class="num">200.00</td></tr>
<tr><td>MWST</td><td><code>=RUNDEN(D2*8.1/108.1;2)</code></td><td class="num">16.20</td></tr>
</table></div>
<div class="callout note"><b>Пастка:</b> MWST — це <b>не</b> брутто × 8.1 %. 216.20 × 8.1 % = 17.51, це неправильно.</div>
<h4>Округлити до 5 раппен</h4>
<div class="fx">=RUNDEN(D2*20;0)/20</div>
<p class="small">32.26 → <b>32.25</b>. Швейцарські рахунки часто округлюють саме так.</p>
<p class="small muted">Ставка 8.1 % — стандартна ставка MWST від 2024 року. Є й інші ставки, а Miete часто без MWST: перевіряйте кожен рахунок.</p>`,
 task:'Рахунок Garage Frei, 430.50 брутто зі ставкою 8.1 %. Скільки нетто й MWST?',answer:'Нетто <b>398.24</b>, MWST <b>32.26</b>. Разом 430.50 ✓',
 check:[{area:'Excel',q:'Брутто 108.10 зі ставкою 8.1 %. Скільки MWST?',o:['8.76','8.10','10.81','100.00'],a:1,ex:'108.10 × 8.1 / 108.1 = 8.10. Нетто 100.00.'},{area:'Excel',q:'Яка формула округлює до 5 раппен?',o:['=RUNDEN(A1;5)','=RUNDEN(A1*20;0)/20','=A1/5','=RUNDEN(A1;0)'],a:1,ex:'Множимо на 20, округлюємо до цілого, ділимо на 20.'}]},
{t:'Навести лад в експорті',min:7,html:`
<p class="big">Експорт із банку чи програми часто приходить «брудним»: числа як текст, пробіли, дублі.</p>
<p class="small">Вставте в чистий аркуш (A1):</p>
${dataBtn('export','брудний експорт')}
<h4>Виправляємо</h4>
<div class="tbl"><table>
<tr><th>Проблема</th><th>Формула в C2 / D2</th></tr>
<tr><td>Зайві пробіли</td><td><code>=GLÄTTEN(A2)</code></td></tr>
<tr><td>«1'250.50 CHF» як текст</td><td><code>=ZAHLENWERT(WECHSELN(B2;" CHF";"");".";"'")</code></td></tr>
</table></div>
<p class="small"><code>WECHSELN</code> прибирає « CHF». <code>ZAHLENWERT</code> перетворює текст на число, де «.» — десятковий знак, а «'» — розділювач тисяч.</p>
<h4>Далі</h4>
<div class="steps">
 <div><span>1. Копіюємо C:D → <b>Вставити лише значення</b></span></div>
 <div><span>2. <de>Daten → Duplikate entfernen</de></span></div>
 <div class="hl"><span>3. Перевіряємо суму</span></div>
</div>
<p class="small">Дані в одній колонці? <de>Daten → Text in Spalten</de>.</p>
<div class="callout note"><b>Завжди працюйте з копією.</b> Оригінальний експорт не змінюйте: він ваш доказ.</div>`,
 task:'Яка сума після очищення і скільки рядків залишилося?',answer:'3 рядки (RE-1001 був двічі). Сума <b>14’630.50</b>',
 check:[{area:'Excel',q:'Що прибирає GLÄTTEN?',o:['Зайві пробіли','Числа','Формули','Рядки'],a:0,ex:'GLÄTTEN прибирає зайві пробіли, через які часто не спрацьовує пошук.'},{area:'Excel',q:'Число стоїть ліворуч і SUMME дає 0. Що це, найімовірніше?',o:['Текст, а не число','Формат дати','Захист аркуша','Великий шрифт'],a:0,ex:'Числа, збережені як текст, SUMME ігнорує. Допоможе ZAHLENWERT.'}]},
{t:'PivotTable і звірка двох списків',min:8,html:`
<p class="big">Два інструменти, які економлять години: <b>звіт за хвилину</b> і <b>«чого бракує?»</b></p>
<h4>PivotTable</h4>

</div>

<tr><th>Konto</th><th class="num">Ja</th><th class="num">Nein</th><th class="num">Total</th></tr>

</table></div>
<p class="small">Дані змінилися? Натисніть <de>Aktualisieren</de>: Pivot сам не оновлюється.</p>
<h4>Звірка двох списків</h4>
<p class="small">Банк ліворуч, bexio праворуч. Вставте в чистий аркуш (A1):</p>
${dataBtn('abgleich','банк і bexio')}
<div class="fx">=WENN(ZÄHLENWENN($D$2:$D$5;A2)=0;"fehlt in bexio";"ok")</div>
<p class="small">Вставте в C2 і скопіюйте вниз.</p>
<p class="small"><b>Де взяти дані:</b> Kontenblatt у bexio експортується в Excel.</p>`,
 task:'Які рахунки не збігаються у двох списках?',answer:'<b>RE-2003</b> є в банку, але немає в bexio. <b>RE-2004</b> є в bexio, але немає в банку. Для другого випадку потрібна така сама формула в інший бік.',
 check:[{area:'Excel',q:'Ви змінили дані. Pivot показує старе. Що робити?',o:['Aktualisieren','Видалити файл','Перезапустити комп’ютер','Нічого, оновиться сам'],a:0,ex:'Pivot потрібно оновити: Aktualisieren.'},{area:'Excel',q:'Що рахує ZÄHLENWENN у звірці?',o:['Скільки разів номер є в другому списку','Суму','Дату','MWST'],a:0,ex:'0 означає, що номера в другому списку немає.'}]}
]}
};
let exCourse=null,exLesson=null;
function renderExtra(){
  if(exCourse===null){
    const card=k=>{const c=EXTRAS[k];return`<section class="week"><h3>${esc(c.t)}</h3><p class="small muted" style="margin-top:-4px">${esc(c.sub)}</p><div class="days">${c.lessons.map((l,i)=>{const done=(S.extra||{})[k+i];return`<button class="day open" onclick="openExtra('${k}',${i})" aria-label="${esc(c.t)}, урок ${i+1}: ${esc(l.t)}"><span class="n"><span>Урок ${i+1}</span><span class="pill ${done?'ok':'go'}">${done?'✓ готово':'відкрито'}</span></span><span class="tt">${esc(l.t)}</span></button>`}).join('')}</div></section>`};
    app.innerHTML=`<div class="eyebrow">Додатково</div><h2>bexio та Excel</h2><p class="lead">Усі уроки відкриті. Проходьте в будь-якому порядку або лише те, що потрібно зараз. Вони не впливають на 30-денний план.</p><div class="weeks">${card('bexio')}${card('excel')}</div>`;return}
  const c=EXTRAS[exCourse],l=c.lessons[exLesson],id=exCourse+exLesson,done=(S.extra||{})[id],next=c.lessons[exLesson+1];
  app.innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn ghost" onclick="openExtra(null)">← Усі уроки</button></div>
  <div class="eyebrow">${esc(c.t)} · урок ${exLesson+1} з ${c.lessons.length} · ≈${l.min} хв</div><h2>${esc(l.t)}</h2>
  <div class="prose">${l.html}</div>
  <div class="secHead"><span class="k">✎</span><h3>Спробуйте</h3></div>
  <div class="prose"><p>${esc(l.task)}</p><details class="more" style="margin-top:8px"><summary>Показати відповідь</summary><p style="margin:10px 0 0">${l.answer}</p></details></div>
  <div class="secHead"><span class="k">?</span><h3>Перевірка</h3></div>
  <div class="stack" id="exq" style="margin-top:12px"></div>
  <p class="small muted" style="margin-top:20px">${esc(c.note)}</p>
  <p class="small muted">Джерела: ${c.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}</p>
  <div class="panel row" style="margin-top:20px;justify-content:space-between"><button class="btn ${done?'ghost':'accent'}" id="exDone">${done?'Скасувати позначку':'Позначити пройденим'}</button>${next?`<button class="btn ghost" onclick="openExtra('${exCourse}',${exLesson+1})">Наступний урок →</button>`:''}</div>`;
  quiz(document.getElementById('exq'),l.check,c.t+' · урок '+(exLesson+1));
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(EX_DATA[b.dataset.copy],'Скопійовано — вставте в Excel'));
  document.getElementById('exDone').onclick=()=>{S.extra=S.extra||{};S.extra[id]=!S.extra[id];save();renderExtra()};
}
function openExtra(k,i){exCourse=k;exLesson=k===null?null:i;renderExtra();window.scrollTo(0,0)}

/* boot: open the view named in the link's #anchor, if any */
updateProg();
const h=(location.hash||'').slice(1);
setView(['plan','diagnose','lesson','cards','glossar','fehler','extra'].includes(h)?h:'plan');
</script>
